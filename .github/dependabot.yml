version: 2

# Monthly, not weekly. This project has five direct dependencies and no service
# to keep patched; a weekly cadence would be noise.
updates:
  - package-ecosystem: nuget
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
