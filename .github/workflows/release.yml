name: Release

# Cut a release by pushing a tag: git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# The three executables publish into ONE folder on purpose. The overlay starts
# the server by looking for Quantumwake.Server.exe next to itself, so splitting
# them into separate archives would break launching the overlay on its own.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          "tag=$tag"         | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append

      # Never ship a build whose parser fixtures fail: the whole app is a log
      # reader, so a red test here means the release would show empty views.
      - name: Test
        run: dotnet test Quantumwake.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          $out = 'dist/QuantumWake'
          foreach ($project in 'Server', 'Overlay', 'Cli') {
            dotnet publish "src/Quantumwake.$project" -c Release -r win-x64 --self-contained false `
              -p:Version=${{ steps.version.outputs.version }} -o $out
            if ($LASTEXITCODE -ne 0) { throw "publish failed: $project" }
          }
          Copy-Item README.md, LICENSE, NOTICE $out

      - name: Archive
        shell: pwsh
        run: |
          $name = "QuantumWake-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path dist/QuantumWake -DestinationPath $name
          "asset=$name" | Out-File $env:GITHUB_OUTPUT -Append
        id: archive

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Quantum Wake ${{ steps.version.outputs.version }}** - a pilot's logbook for Star Citizen.

          Unzip and run ``Quantumwake.Overlay.exe`` for the overlay, which starts the
          dashboard itself, or ``Quantumwake.Server.exe`` for the dashboard alone on
          http://127.0.0.1:31337.

          Requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0).
          Reads ``Game.log`` only - nothing is written to the game directory, and no
          network request leaves the machine.

          Star Citizen must run in Borderless Windowed for the overlay to be visible.
          "@
          gh release create '${{ steps.version.outputs.tag }}' '${{ steps.archive.outputs.asset }}' `
            --title 'Quantum Wake ${{ steps.version.outputs.version }}' `
            --notes $notes
