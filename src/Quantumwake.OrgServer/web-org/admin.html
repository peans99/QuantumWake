<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link rel="stylesheet" href="/org.css">
</head>
<body>
<main>
  <h1>Admin</h1>
  <div class="panel" id="card"><p class="muted">One moment&hellip;</p></div>
  <div id="desk" hidden>
    <h2>Start an org</h2>
    <div class="panel">
      <p class="muted">An org you create is approved by the act of creating it
      &mdash; there is nobody above a server admin to ask.</p>
      <div class="row">
        <input type="text" id="new-org-name" placeholder="Name" autocomplete="off">
        <input type="text" id="new-org-note" placeholder="Note (optional)" autocomplete="off">
        <button class="primary" id="new-org-create">Create</button>
      </div>
      <p class="muted" id="new-org-said"></p>
    </div>

    <h2>Waiting for approval</h2>
    <div class="panel"><table id="pending"></table></div>
    <h2>Active orgs</h2>
    <div class="panel"><table id="active"></table></div>
    <h2>Suspended orgs</h2>
    <div class="panel"><table id="suspended"></table></div>
    <h2>Recent changes</h2>
    <div class="panel"><table id="audit"></table></div>
  </div>
</main>
<script src="/org.js"></script>
<script>
(async () => {
  const card = document.getElementById('card');

  async function drawStatus(status, tableId, actions) {
    const result = await api('/api/admin/orgs?status=' + status);
    if (!result.ok) return false;
    const table = document.getElementById(tableId);
    clear(table);
    if (!result.data.length) {
      table.appendChild(el('caption', 'Nothing here.'));
      return true;
    }
    for (const org of result.data) {
      const tr = el('tr');
      tr.appendChild(el('td', org.name));
      tr.appendChild(el('td', org.createdBy, 'muted'));
      tr.appendChild(el('td', org.members + ' member' + (org.members === 1 ? '' : 's'), 'muted'));
      const cell = el('td');
      for (const action of actions) {
        const button = el('button', action.label, action.className);
        button.addEventListener('click', async () => {
          if (action.confirm && !confirm(action.confirm)) return;
          await api('/api/admin/orgs/' + org.id + action.path, { method: action.method });
          draw();
        });
        cell.appendChild(button);
        cell.appendChild(document.createTextNode(' '));
      }
      tr.appendChild(cell);
      table.appendChild(tr);
    }
    return true;
  }

  async function draw() {
    const shown = await drawStatus('pending', 'pending', [
      { label: 'Approve', className: 'primary', path: '/activate', method: 'POST' },
      { label: 'Delete', className: 'warn', path: '', method: 'DELETE',
        confirm: 'Delete this org and everything in it?' },
    ]);
    if (!shown) {
      clear(card);
      card.appendChild(el('p', 'There is nothing here.'));
      await signInChoices(card, '/admin');
      return;
    }
    clear(card);
    card.appendChild(el('p', 'Approving an org lets its owner start inviting people.', 'muted'));
    document.getElementById('desk').hidden = false;
    await drawStatus('active', 'active', [
      { label: 'Suspend', className: 'warn', path: '/suspend', method: 'POST',
        confirm: 'Suspend this org? Members keep their data but the space goes quiet.' },
    ]);
    await drawStatus('suspended', 'suspended', [
      { label: 'Restore', className: 'primary', path: '/activate', method: 'POST' },
      { label: 'Delete', className: 'warn', path: '', method: 'DELETE',
        confirm: 'Permanently delete this suspended org and everything in it?' },
    ]);
    const events = await api('/api/admin/audit');
    const audit = document.getElementById('audit'); clear(audit);
    for (const event of (events.data || [])) {
      const tr = el('tr'); tr.appendChild(el('td', ago(event.at), 'muted'));
      tr.appendChild(el('td', event.orgId || 'account', 'muted'));
      tr.appendChild(el('td', event.action)); tr.appendChild(el('td', event.target || '', 'muted'));
      tr.appendChild(el('td', event.detail || '', 'muted')); audit.appendChild(tr);
    }
  }

  // Wired once, outside draw(): draw() runs again after every action, and a
  // listener added each time would create one org per press per redraw.
  const said = document.getElementById('new-org-said');
  const name = document.getElementById('new-org-name');
  const note = document.getElementById('new-org-note');

  document.getElementById('new-org-create').addEventListener('click', async () => {
    said.textContent = '';
    if (!name.value.trim()) { said.textContent = 'An org needs a name.'; return; }

    const result = await api('/api/orgs', {
      method: 'POST',
      body: { name: name.value.trim(), note: note.value.trim() || null },
    });

    if (!result.ok) {
      said.textContent = (result.data && result.data.message) || 'That did not work.';
      return;
    }

    // Says the status rather than assuming it: a server admin's org is active
    // at once, and the same button pressed by anyone else would not be.
    said.textContent = 'Created "' + result.data.name + '" (' + result.data.status + ').';
    name.value = '';
    note.value = '';
    draw();
  });

  draw();
})();
</script>
</body>
</html>
