<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum Wake · MFD</title><link rel="stylesheet" href="mfd.css"></head>
<body><main id="mfd">
  <nav id="top" class="edge top" aria-label="MFD pages"></nav>
  <nav id="left" class="edge left" aria-label="Left buttons"></nav>
  <!--
    One header line and no footer. The frame is 480 px square with edges taking
    28% of it, so a second strip of chrome was costing a reading. Everything the
    footer carried that a pilot needs - which frame this is, which Cougar drives
    it - is identity, and identity belongs at the top with the rest of it.
  -->
  <section class="display">
    <header><img id="brand" src="assets/mark.svg" alt="Quantum Wake"><img id="maker" alt="" hidden>
      <span id="identity">MFD</span><span id="connection">CONNECTING</span></header>
<nav id="breadcrumb" aria-label="Menu path"><button id="crumb-home" type="button">Home</button><span id="crumb-divider">/</span><button id="crumb-parent" type="button">Flight</button></nav>
<h1 id="title">Cockpit</h1>
<div id="menu" aria-label="Choose a screen" hidden></div>
<div id="content" tabindex="0" aria-label="Screen readings">
    <figure id="map" hidden><svg id="map-plot" viewBox="-1.18 -1.18 2.36 2.36" aria-hidden="true"></svg>
      <figcaption id="map-note"></figcaption></figure>
<div id="readings"></div>
</div>
<button id="more" type="button" hidden>More details</button>
<div id="scroll-hint" hidden>UP / DOWN · more below</div>
    <div id="action" hidden><b id="action-text"></b><span id="action-note"></span></div>
  </section>
  <nav id="right" class="edge right" aria-label="Right buttons"></nav>
  <nav id="bottom" class="edge bottom" aria-label="Navigation buttons"></nav>
  <div id="alignment" hidden><div class="crosshair"></div><strong id="alignment-name"></strong>
    <p>Align this rectangle with the visible opening.</p><p>Adjust placement in MFD setup.</p></div>
</main><script src="mfd-core.js"></script><script src="mfd.js"></script></body></html>
